# Upstream source drift
#
# Read-only weekly check that the upstream sources the catalogs and profiles
# pin have not moved: the FedRAMP CR26 statements of the catalog KSIs, the
# ENISA CRA SRP glossary version, the current OSPS Baseline version and the
# draft status of NIST SP 800-218r1. See scripts/check_upstream_drift.py.
#
# It never runs on a pull request and is not a required check: an upstream
# release must not block anyone's merge. A failed run is the signal to
# re-read the source and re-pin with tests.

name: Upstream source drift

on:
  schedule:
    - cron: "23 6 * * 1"  # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Check pinned upstream sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          python -m pip install --require-hashes -r .github/requirements/runtime.txt
          python -m pip install --no-deps -e .

      - name: Compare pinned sources with upstream
        run: python scripts/check_upstream_drift.py
